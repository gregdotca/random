<!doctype html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    {% include 'custom.headers' ignore missing %}
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet" type="text/css" />
</head>
<body class="p-8">
<div id="content">
    <h1 class="text-2xl mb-3"><a href="/">{{ app_title }}</a></h1>
    <form method="POST" action="/" class="pb-7" onsubmit="document.getElementById('loading').hidden = false;">
        <div class="flex">
            <fieldset class="fieldset bg-base-200 border border-base-300 p-10 px-15 -ml-1 rounded-box">
                <label># of Options<BR>
                <input id="options" class="input mt-1" name="options" type="number" min="1" max="{{ max_options }}" step="1" placeholder="2" value="{{ options }}" autofocus></label>
                <BR>
                <label># of Rolls<BR>
                <input id="rolls" class="input mt-1" name="rolls" type="number" min="1" max="{{ max_rolls }}" step="1" placeholder="100000" value="{{ rolls }}"></label>
                <BR>
                <label for="details">Show full results?&nbsp;
                {% if details == 1 %}
                    <input id="details" type="checkbox" name="details" value="1" checked></label><BR>
                {% else %}
                    <input id="details" type="checkbox" name="details" value="1"></label><BR>
                {% endif %}
                <input type="submit" class="btn btn-accent dark:btn-primary" value="Randomize!">
            </fieldset>
        </div>
        <div id="loading" class="pt-8" hidden><span class="loading loading-xl"></span></div>
    </form>
    {{ page_body|safe }}
</div>
<script>
    // Hide the spinner when Back restores this page from the browser's cache
    window.addEventListener('pageshow', function () {
        document.getElementById('loading').hidden = true;
    });
</script>
</body>
</html>
